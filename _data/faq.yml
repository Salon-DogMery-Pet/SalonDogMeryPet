intrebari:
  - intrebare: "Cat dureaza o sedinta la frizeria canina?"
    raspuns: "Intre 1 h 30 min si 3 h, in functie de rasa, tipul si starea blanii si de comportamentul cainelui."
    pe_prima_pagina: true
  - intrebare: "Cat costa tunsul si ingrijirea cainelui?"
    raspuns: "[preturi] La blana foarte incalcita, subpar abundent sau temperament dificil, pretul final se stabileste dupa evaluarea cainelui."
    pe_prima_pagina: true
  - intrebare: "Cum fac o programare?"
    raspuns: "Ne suni la [telefon] sau ne scrii pe WhatsApp, iar impreuna alegem ziua si ora."
    pe_prima_pagina: true
  - intrebare: "Primiti orice caine?"
    raspuns: "Nu. Nu folosim anestezic, deci nu primim caini foarte agitati sau agresivi. Nu ingrijim nici caini cu probleme dermatologice sau femele gestante."
    pe_prima_pagina: false
  - intrebare: "Unde gasesc o frizerie canina in Pitesti?"
    raspuns: "Frizeria canina DogMery Pet este pe Str. Tache Ionescu nr. 27, bl. Q2, Pitesti. Programari la [telefon] sau pe WhatsApp."
    pe_prima_pagina: true
